name: CI
on: [push, pull_request]

jobs:
  rtl-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: make lint

  reference-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python model/reference.py

  uvm-verilator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Verilator-compatible UVM 2020 library
        run: |
          git clone --depth 1 https://github.com/verilator/uvm.git /tmp/uvm

      - name: Run random UVM regression in Verilator container
        run: |
          docker run --rm             -v "$PWD:/work"             -v "/tmp/uvm:/uvm:ro"             -w /work             verilator/verilator:latest             bash -lc 'verilator --version && make verilator-uvm TEST=switch_base_test UVM_HOME=/uvm/src'

      - name: Run hotspot UVM regression in same toolchain
        run: |
          docker run --rm             -v "$PWD:/work"             -v "/tmp/uvm:/uvm:ro"             -w /work             verilator/verilator:latest             bash -lc './obj_dir/simv +UVM_TESTNAME=switch_hotspot_test +UVM_VERBOSITY=UVM_LOW'
