name: CI
on: [push, pull_request]

jobs:
  rtl-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: make lint

  reference-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python model/reference.py

  uvm-verilator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Verilator 5.052
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf bison flex libfl-dev help2man z3
          git clone --depth 1 --branch v5.052 https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure
          make -j2
          sudo make install
          verilator --version
      - name: Fetch UVM 2020 library with Verilator compatibility
        run: |
          git clone --depth 1 https://github.com/chipsalliance/uvm-verilator.git /tmp/uvm-verilator
      - name: Build and run random UVM regression
        run: |
          make verilator-uvm TEST=switch_base_test UVM_HOME=/tmp/uvm-verilator/src
      - name: Run hotspot UVM regression
        run: |
          ./obj_dir/simv +UVM_TESTNAME=switch_hotspot_test +UVM_VERBOSITY=UVM_LOW
